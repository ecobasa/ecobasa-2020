{% load i18n %}
{# The filters in use as small pills, each with an x to take it off, like the gifts'. Skills in purple. Bound to $store.eventMap #}
<div x-show="$store.eventMap.pills.length" x-cloak class="flex flex-wrap gap-1">
  <template x-for="pill in $store.eventMap.pills" :key="pill.key">
    <span class="inline-flex items-center gap-1 text-xs text-secondary rounded-full px-2 py-0.5" :class="pill.skill ? 'bg-purple' : 'bg-primary'">
      <i class="fa-solid" :class="pill.icon"></i>
      <span x-text="pill.label" class="truncate max-w-[12rem]"></span>
      <button type="button" @click="$store.eventMap.unset(pill.key)" class="opacity-70 hover:opacity-100" aria-label="{% trans 'Remove' %}">&times;</button>
    </span>
  </template>
</div>
