{# An offer or wish as a pill in its kind's colour and icon: `listing`, optionally how much (`amount`) and a `link` to it #}{% if link %}<a href="{{ listing.get_absolute_url }}"{% else %}<span{% endif %} class="pill {{ listing.colour }} text-xs" title="{{ listing.kind_label }}">{% include "gifts/_listing_icon.html" %}{{ listing.display_title|truncatechars:40 }}{% if amount %}<span class="ml-1 opacity-80">({{ amount }})</span>{% endif %}{% if link %}</a>{% else %}</span>{% endif %}
