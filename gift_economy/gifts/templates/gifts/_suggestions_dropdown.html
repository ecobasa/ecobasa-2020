<ul x-show="open" x-cloak class="suggestions-dropdown" role="listbox">
  <template x-for="(item, i) in items" :key="i">
    <li :class="i === active ? 'bg-primary text-secondary' : ''"
      class="px-3 py-1 cursor-pointer flex items-center justify-between gap-2"
      @mousedown.prevent="selectItem(item)" role="option">
      <span x-text="item.value" class="truncate"></span>
      <i x-show="item.type === 'offer'" class="fa fa-gift text-xs opacity-50 flex-shrink-0"></i>
      <i x-show="item.type === 'wish'"  class="fa fa-heart text-xs opacity-50 flex-shrink-0"></i>
      <i x-show="item.type === 'owner'" class="fa fa-user text-xs opacity-50 flex-shrink-0"></i>
      <i x-show="item.type === 'place'" class="fa fa-map-marker-alt text-xs opacity-50 flex-shrink-0"></i>
      <i x-show="item.type === 'skill'" class="fa fa-graduation-cap text-xs opacity-50 flex-shrink-0"></i>
      <i x-show="item.type === 'text'"  class="fa fa-align-left text-xs opacity-50 flex-shrink-0"></i>
    </li>
  </template>
</ul>
