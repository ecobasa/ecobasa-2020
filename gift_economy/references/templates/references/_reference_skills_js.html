{% load i18n %}
{# Skill input with suggestions for references/_reference_form_fields.html #}
{% if form.can_tag %}
  {{ held_skills|json_script:"reference-held-skills" }}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css">
  <script>
  (function () {
    const AUTOCOMPLETE_URL = '{% url "skills:api_autocomplete" %}';
    const PROPOSALS_URL    = '{% url "skills:api_proposals" %}';
    // Skills this person or community already lists: suggested first
    const HELD = JSON.parse(document.getElementById('reference-held-skills').textContent);
    const HELD_HEADER = '{{ held_skills_header|escapejs }}';

    function init() {
      const input = document.getElementById('reference-skill-names');
      if (!input || input._tagify) return;
      const tagify = new Tagify(input, {
        editTags: false,
        enforceWhitelist: true,
        whitelist: [...new Set([...HELD, ...input.value.split(',').map(s => s.trim()).filter(Boolean)])].map(s => ({ value: s })),
        dropdown: { enabled: 0, maxItems: 20, closeOnSelect: true, highlightFirst: true },
        originalInputValueFormat: vals => vals.map(v => v.value).join(', '),
      });
      function show(names, q, header) {
        tagify.settings.whitelist = [...new Set(names)].map(s => ({ value: s }));
        tagify.settings.dropdown.header = header || '';
        tagify.loading(false).dropdown.show.call(tagify, q);
      }
      function suggest() {
        // Nothing typed yet: their own skills, or curated proposals if they list none
        if (HELD.length) return show(HELD, '', HELD_HEADER);
        fetch(PROPOSALS_URL).then(r => r.json()).then(data => show((data.results || []).map(r => r.text), ''));
      }
      let timer = null;
      tagify.on('input', e => {
        clearTimeout(timer);
        const q = (e.detail.value || '').trim();
        if (q.length < 2) return suggest();
        // Typing: their matching skills first, then the taxonomy
        const lower = q.toLowerCase();
        const held = HELD.filter(name => name.toLowerCase().includes(lower));
        timer = setTimeout(() => {
          fetch(AUTOCOMPLETE_URL + '?q=' + encodeURIComponent(q)).then(r => r.json()).then(data => {
            show([...held, ...(data.results || []).map(r => r.text)], q);
          });
        }, 300);
      });
      tagify.on('focus', () => { if (!tagify.state.inputText) suggest(); });
    }

    function start() {
      if (window.Tagify) return init();
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.min.js';
      script.onload = init;
      document.head.appendChild(script);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
  </script>
{% endif %}
