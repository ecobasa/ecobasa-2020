{% load i18n %}
<div class="relative" x-data="{ visible: false }">
  <input x-ref="input" type="password" x-bind:type="visible ? 'text' : 'password'" name="{{ widget.name }}"
    {% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}
    {% include "django/forms/widgets/attrs.html" %}>
  <button type="button" @click="visible = !visible; $refs.input.focus()" class="text-gray-500 hover:text-gray-800 absolute right-0 inset-y-0 h-full w-10 flex items-center justify-center"
          title="{% trans 'Show password' %}">
    <i x-show="!visible" class="fa-regular fa-eye text-lg"></i>
    <i x-show="visible" class="fa-regular fa-eye-slash text-lg"></i>
  </button>
</div>
