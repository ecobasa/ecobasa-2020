{# One fact of the sidebar's statistics and "How we live": an icon, a small label, the value #}
<div class="flex items-start gap-2 min-w-0">
	<i class="fa-solid {{ icon }} text-primary w-5 text-center mt-1"></i>
	<div><dt class="text-xs opacity-70">{{ label }}</dt><dd class="font-semibold">{{ value }}</dd></div>
</div>
