{% load i18n %}
{# A member chooses here, next to the skills and gifts, whether their own offers and skills show among them (also in their profile settings) #}
{% if membership and membership.is_counted %}
	<form id="show-offers" method="post" action="{% url 'communities:show_offers' community.slug %}" class="mt-3 scroll-mt-24">{% csrf_token %}
		<input type="hidden" name="shows_offers" value="{% if membership.shows_offers %}0{% else %}1{% endif %}">
		<label class="flex items-start gap-2 text-sm cursor-pointer">
			<input type="checkbox" class="form-checkbox mt-0.5 flex-shrink-0" {% if membership.shows_offers %}checked{% endif %} onchange="this.form.submit()">
			<span>{% blocktrans with name=request.user.name|default:request.user.username %}Show my ({{ name }}) personal offers and skills on this community page{% endblocktrans %}</span>
		</label>
	</form>
{% endif %}
