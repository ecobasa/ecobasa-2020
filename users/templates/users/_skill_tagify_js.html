<script>
(function () {
  const AUTOCOMPLETE_URL = '{% url "skills:api_autocomplete" %}';
  const PROPOSALS_URL    = '{% url "skills:api_proposals" %}';

  // Names as the field holds them: comma-separated, a taggit field quotes those with a space
  function namesIn(value) {
    return (value || '').split(',').map(s => s.trim().replace(/^"(.*)"$/, '$1')).filter(Boolean);
  }

  function makeTagOpts(existingValue) {
    const existing = namesIn(existingValue);
    return {
      editTags: false,
      enforceWhitelist: true,
      whitelist: existing.map(s => ({ value: s })),
      dropdown: {
        enabled: 0,
        maxItems: 20,
        closeOnSelect: true,
        searchKeys: ['value'],
        highlightFirst: true,
      },
      // A trailing comma, so taggit doesn't split a single "Cob building" at the space
      originalInputValueFormat: vals => vals.length ? vals.map(v => v.value).join(', ') + ',' : '',
    };
  }

  function wireTagify(tagify, proposalHeader) {
    let fetchTimer = null;

    tagify.on('input', function (e) {
      clearTimeout(fetchTimer);
      const q = (e.detail.value || '').trim();
      const isSearch = q.length >= 2;
      const url = isSearch ? AUTOCOMPLETE_URL + '?q=' + encodeURIComponent(q) : PROPOSALS_URL;
      fetchTimer = setTimeout(function () {
        fetch(url).then(r => r.json()).then(data => {
          tagify.settings.whitelist = (data.results || []).map(r => ({ value: r.text }));
          tagify.settings.dropdown.header = isSearch ? '' : proposalHeader;
          tagify.loading(false).dropdown.show.call(tagify, q);
        });
      }, isSearch ? 300 : 0);
    });

    tagify.on('focus', function () {
      if (tagify.state.inputText) return;
      fetch(PROPOSALS_URL).then(r => r.json()).then(data => {
        tagify.settings.whitelist = (data.results || []).map(r => ({ value: r.text }));
        tagify.settings.dropdown.header = proposalHeader;
        tagify.dropdown.show.call(tagify, '');
      });
    });
  }

  // Every skill field (marked data-skill-tags, its value the header of the proposals):
  // skills from the list only, suggested in any language
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('[data-skill-tags]').forEach(function (input) {
      input.value = namesIn(input.value).join(', ');
      wireTagify(new Tagify(input, makeTagOpts(input.value)), input.dataset.skillTags);
    });
  });
})();
</script>
