name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # django.env / postgres.env are gitignored (real deployments set these via
      # secrets); CI just needs the same local-dev-style values used in docker-compose.yaml.
      - name: Write env files
        run: |
          cat > postgres.env <<'EOF'
          POSTGRES_USER=ecobasa
          POSTGRES_PASSWORD=ecobasa
          POSTGRES_DB=ecobasa
          EOF
          cat > django.env <<'EOF'
          DJANGO_SETTINGS_MODULE=settings.test
          DATABASE_URL=postgis://ecobasa:ecobasa@database/ecobasa
          EOF

      - name: Build django image
        run: docker compose build django

      - name: Start database
        run: docker compose up -d database

      # pg_isready on the container's socket already answers while the image sets up
      # PostGIS on a temporary server, which then restarts and only then listens on the
      # network: the next step got "connection refused". So wait the way the tests
      # connect, from the django container over the network, until it holds three
      # times in a row.
      - name: Wait for database to be ready
        run: |
          docker compose run --rm -T django python - <<'EOF'
          import os, sys, time
          import psycopg2

          dsn = os.environ["DATABASE_URL"].replace("postgis://", "postgresql://", 1)
          in_a_row = 0
          for _ in range(90):
              try:
                  psycopg2.connect(dsn, connect_timeout=3).close()
                  in_a_row += 1
                  if in_a_row == 3:
                      sys.exit(0)
              except psycopg2.OperationalError:
                  in_a_row = 0
              time.sleep(2)
          sys.exit("database never became ready")
          EOF

      - name: Check for missing migrations
        run: docker compose run --rm django python manage.py makemigrations --check --dry-run

      # *.mo files are gitignored and `run` overrides the compose command that
      # normally compiles them, so the translation tests would see only English.
      - name: Run test suite
        run: docker compose run --rm django bash -c "python manage.py compilemessages --ignore=node_modules --ignore=.venv && python -m pytest -q --create-db"

      - name: Tear down
        if: always()
        run: docker compose down -v
