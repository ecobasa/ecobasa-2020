<script src="https://cdn.jsdelivr.net/npm/ol@v7.2.2/dist/ol.js"></script>
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('stopWhere', (where, communityName) => ({
    where: where, query: communityName, results: [],
    async search() {
      const q = this.query.trim();
      if (q.length < 2) { this.results = []; return; }
      const response = await fetch('{% url "tours:api-hosts" %}?q=' + encodeURIComponent(q));
      this.results = (await response.json()).results;
    },
    // A community chosen: its events to choose from
    choose(res) {
      document.getElementById('{{ form.community.id_for_label }}').value = res.id;
      this.query = res.name;
      this.results = [];
      const select = document.getElementById('{{ form.event.id_for_label }}');
      select.length = 1;
      res.events.forEach(event => {
        select.add(new Option(event.title + ' (' + event.kind + ', ' + event.dates + ')', event.id));
      });
    },
    // The map was hidden: let it take its size
    shown() {
      if (this.where === 'place') this.$nextTick(() => window.stopPicker && window.stopPicker.map.updateSize());
    },
  }));
});
document.addEventListener('DOMContentLoaded', () => {
  const locationInput = document.getElementById('id_location');
  window.stopPicker = EcoMap.initLocationPicker({
    mapTarget: 'stop-location-map',
    locationInput: locationInput,
    countryInput: document.getElementById('id_country'),
    nameInput: document.getElementById('id_location_name'),
    groupName: 'stop-layer',
    setPointFn: 'setStopPoint',
    badge: 0xF3C5,  // fa-location-dot
    existingWkt: locationInput ? locationInput.value : '',
  });
});
</script>
